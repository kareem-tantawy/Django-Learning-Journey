<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Engima Store</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000; /* Black background */
            color: #fff; /* White text */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        a {
            color: #00ff00; /* Green links */
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Login Form Styles */
        .login-container {
            background-color: #111; /* Dark gray container */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
        }

        .login-container h2 {
            color: #00ff00; /* Green text */
            margin-bottom: 20px;
        }

        .login-container input {
            width: 93%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00ff00; /* Green border */
            border-radius: 4px;
            background-color: #222; /* Dark gray input */
            color: #fff; /* White text */
        }

        .login-container input:focus {
            outline: none;
            border-color: #00cc00; /* Darker green on focus */
        }

        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #00ff00; /* Green button */
            color: #000; /* Black text */
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-container button:hover {
            background-color: #00cc00; /* Darker green on hover */
        }

        .login-container .error {
            color: #ff0000; /* Red error text */
            margin: 10px 0;
        }

        .login-container .register-link {
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>

        <!-- Display error messages -->
        {% if form.errors %}
            <div class="error">
                Your username and password didn't match. Please try again.
            </div>
        {% endif %}

        <!-- Login Form -->
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- Register Link -->
        <div class="register-link">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>.
        </div>
    </div>
</body>
</html>
