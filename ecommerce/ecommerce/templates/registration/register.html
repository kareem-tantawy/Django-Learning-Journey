<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Engima Store</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000; /* Black background */
            color: #fff; /* White text */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        a {
            color: #00ff00; /* Green links */
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Registration Form Styles */
        .register-container {
            background-color: #111; /* Dark gray container */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
        }

        .register-container h2 {
            color: #00ff00; /* Green text */
            margin-bottom: 20px;
        }

        .register-container input {
            width: 93%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00ff00; /* Green border */
            border-radius: 4px;
            background-color: #222; /* Dark gray input */
            color: #fff; /* White text */
        }

        .register-container input:focus {
            outline: none;
            border-color: #00cc00; /* Darker green on focus */
        }

        .register-container button {
            width: 100%;
            padding: 10px;
            background-color: #00ff00; /* Green button */
            color: #000; /* Black text */
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-container button:hover {
            background-color: #00cc00; /* Darker green on hover */
        }

        .register-container .error {
            color: #ff0000; /* Red error text */
            margin: 10px 0;
        }

        .register-container .login-link {
            margin-top: 10px;
            font-size: 14px;
        }

        .register-container .password-mismatch {
            color: #ff0000; /* Red error text */
            font-size: 14px;
            margin-top: 10px;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Register</h2>

        <!-- Display error messages -->
        {% if form.errors %}
            <div class="error">
                {% for field, errors in form.errors.items %}
                    {% for error in errors %}
                        {{ error }}<br>
                    {% endfor %}
                {% endfor %}
            </div>
        {% endif %}

        <!-- Registration Form -->
        <form method="post" action="{% url 'register' %}" onsubmit="return validatePassword()">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" id="password1" name="password1" placeholder="Password" required>
            <input type="password" id="password2" name="password2" placeholder="Confirm Password" required>
            <div class="password-mismatch" id="passwordMismatch">Passwords do not match.</div>
            <button type="submit">Register</button>
        </form>

        <!-- Login Link -->
        <div class="login-link">
            Already have an account? <a href="{% url 'login' %}">Login here</a>.
        </div>
    </div>

    <script>
        // JavaScript for password validation
        function validatePassword() {
            const password1 = document.getElementById('password1').value;
            const password2 = document.getElementById('password2').value;
            const passwordMismatch = document.getElementById('passwordMismatch');

            if (password1 !== password2) {
                passwordMismatch.style.display = 'block'; // Show error message
                return false; // Prevent form submission
            } else {
                passwordMismatch.style.display = 'none'; // Hide error message
                return true; // Allow form submission
            }
        }

        // Optional: Validate passwords in real-time as the user types
        document.getElementById('password2').addEventListener('input', function () {
            validatePassword();
        });
    </script>
</body>
</html>
