<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - Engima</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000; /* Black background */
            color: #fff; /* White text */
        }

        a {
            color: #00ff00; /* Green links */
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Header Styles */
        header {
            background-color: #111; /* Dark gray header */
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff00; /* Green border */
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: #00ff00; /* Green text */
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        nav ul li {
            display: inline;
        }

        /* Main Content Styles */
        .container {
            padding: 20px;
        }

        h2 {
            color: #00ff00; /* Green headings */
            border-bottom: 2px solid #00ff00; /* Green underline */
            padding-bottom: 10px;
        }

        .product-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background-color: #222; /* Dark gray cards */
            padding: 15px;
            border-radius: 8px;
            width: calc(25% - 20px); /* 4 products per row */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            max-width: 100%;
            border-radius: 8px;
        }

        .product-card h3 {
            margin: 10px 0;
            font-size: 18px;
            color: #00ff00; /* Green text */
        }

        .product-card p {
            font-size: 14px;
            color: #ccc; /* Light gray text */
        }

        .product-card .price {
            font-size: 20px;
            color: #00ff00; /* Green price */
            font-weight: bold;
        }

        .product-card a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #00ff00; /* Green button */
            color: #000; /* Black text */
            border-radius: 4px;
            font-weight: bold;
        }

        .product-card a:hover {
            background-color: #00cc00; /* Darker green on hover */
        }

        /* Footer Styles */
        footer {
            background-color: #111; /* Dark gray footer */
            padding: 20px;
            text-align: center;
            border-top: 2px solid #00ff00; /* Green border */
            margin-top: 20px;
        }

        footer p {
            margin: 0;
            color: #00ff00; /* Green text */
        }
    </style>
</head>
<body>
    <header>
        <h1>Engima Store</h1>
        <nav>
            <ul>
                <li><a href={% url 'home' %}>Home</a></li>
                <li><a href={% url 'products' %}>Products</a></li>
                <li><a href={% url 'login' %}>Login</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="container">
        <h2>All Products</h2>
        <div class="product-grid">
            {% for product in Productss %}
                <div class="product-card">
                    <img src="{{ product.image.url }}" alt="{{ product.name }} width="200" height="200"">
                    <h3>{{ product.name }}</h3>
                    <p>{{ product.description }}</p>
                    <p class="price">${{ product.price }}</p>
                    <a href={% url 'product' %}>View Details</a>
                </div>
            {% endfor %}
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Engima. All rights reserved.</p>
    </footer>
</body>
</html>
