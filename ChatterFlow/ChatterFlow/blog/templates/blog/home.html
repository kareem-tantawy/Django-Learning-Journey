{% extends "blog/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <!-- Add Post Button (Top) -->
  <a href="{% url 'post-create' %}" class="add-post-btn">
      <i class="fas fa-plus"></i> Add Post
  </a>
</div>
  {% for post in posts %}


    <div class="post-item">
      <!-- Post Image -->
      <a href="{% url 'profile' post.author.profile.id %}"><img class="post-img" src="{{ post.author.profile.image.url }}" alt="{{ post.author.username }}"></a>
      <!-- Post Details -->
      <div class="post-details">
        <h3 class="post-title"><a href="{% url 'post-detail' post.id %}" class="post-title text-decoration:" style="text-decoration: none;">{{ post.title }}</a></h3>
        
        <div class="author-details">
          <small>Posted by <a href="{% url 'profile' post.author.profile.id %}" style="text-decoration: none;">{{ post.author.username }}</a> on {{ post.date_posted|date:"F d, Y" }}</small>
        </div>

        <div class="post-content">
          <p>{{ post.content|truncatewords:15 }}</p>
        </div>

        <!-- Read More Button -->
        <a href="{% url 'post-detail' post.id %}" class="read-more-btn">Read more</a>
      </div>
    </div>
  {% endfor %}
{% endblock content %}
